name: release
# Rolling `latest` release rebuilt on every push to main. One Linux runner
# cross-compiles all targets (bun supports this natively). The darwin binary
# ships UNSIGNED because codesign only exists on macOS; `install.sh
# --from-release` ad-hoc signs it client-side (no certificate needed), which
# macOS arm64 requires or it SIGKILLs the binary at launch.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx tsc --noEmit
      - run: bun test
      - name: build all targets
        run: |
          mkdir -p dist
          SHA7="${GITHUB_SHA::7}"
          for target in darwin-arm64 linux-x64 linux-arm64; do
            bun build src/mc.ts --compile --minify \
              --target="bun-$target" \
              --define "process.env.MC_BUILD=\"$SHA7\"" \
              --outfile "dist/mc-$target"
          done
          ls -la dist/
      - name: update rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA7="${GITHUB_SHA::7}"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/mc-* \
            --prerelease \
            --title "latest ($SHA7)" \
            --notes "Rolling build of main @ $GITHUB_SHA. Install: clone + \`./install.sh --from-release\`, or \`gh release download latest -R ${GITHUB_REPOSITORY} -p mc-<os>-<arch>\` (macOS: ad-hoc codesign after download, see install.sh)."
